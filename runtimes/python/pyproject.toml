[project]
name = "noodlegraph"
version = "0.4.0"
description = "Behaviour built from blocks: check and run the graphs the noodlegraph editor draws"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "AGPL-3.0-or-later OR LicenseRef-Noodlegraph-Commercial" }
keywords = ["block coding", "visual programming", "node graph", "flow"]
authors = [{ name = "Eagle Creative" }]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/noodlegraph"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
