name: Website

# Publishes the documentation and the live demo to GitHub Pages.
# Switch it on once: repository Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site (docs, demo and what they load)
        run: |
          mkdir site
          cp -r index.html assets docs demo examples editors site/
          mkdir -p site/runtimes
          cp -r runtimes/javascript site/runtimes/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
